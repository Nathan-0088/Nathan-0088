name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate Stats
        run: |
          mkdir -p profile

          curl -L \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            -A "Mozilla/5.0" \
            "https://github-readme-stats.vercel.app/api?username=Nathan-0088&show_icons=true&hide_border=true" \
            -o profile/stats.svg

      - name: Generate Top Languages
        run: |
          curl -L \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            -A "Mozilla/5.0" \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=Nathan-0088&layout=compact&langs_count=8&hide_border=true" \
            -o profile/top-langs.svg

      - name: Verify files
        run: |
          file profile/stats.svg
          file profile/top-langs.svg
          ls -lh profile/

      - name: Commit Stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update github stats"
            git push
          fi
