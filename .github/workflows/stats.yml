name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download GitHub Stats
        run: |
          mkdir -p profile

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            "https://github-readme-stats.vercel.app/api?username=${{ github.repository_owner }}&show_icons=true&hide_border=true" \
            -o profile/stats.svg

      - name: Download Top Languages
        run: |
          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true" \
            -o profile/top-langs.svg

      - name: Commit Stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update github stats"
            git push
          fi
